{% extends "base.html" %}

{% block title %}Reset your password{% endblock %}

{% block content %}
	<h1>Reset your password</h1>
	<form method="post">
		{% csrf_token %}
		{{ form.email.label_tag }}
		{{ form.email }}
		<input type="submit" value="Reset password">
	</form>
	<p><a href="{% url 'login' %}">Back to login</a></p>
{% endblock %}
